    <script>
        const TOTAL_POINTS = 34;
        let userScore = {
            part1: {},
            part2: {},
            part3: {}
        };

        const appData = {
            part1: [
                {
                    id: 'p1q1',
                    question: `**Câu 1:** Khẳng định nào sau đây là **sai**?`,
                    options: [
                        `Một dãy số tăng thì bị chặn dưới.`,
                        `Một dãy số giảm thì bị chặn trên.`,
                        `Một dãy số bị chặn thì phải tăng hoặc giảm.`,
                        `Một dãy số không đổi thì bị chặn.`
                    ],
                    correctAnswer: 'C',
                    solution: `
                        <p class="font-semibold text-lg">Chọn C</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <ul class="list-disc list-inside ml-2 space-y-1">
                            <li><b>A. Đúng:</b> Dãy số tăng $(u_n)$ có $u_{n+1} \ge u_n$. Mọi số hạng đều $\ge u_1$. Vậy dãy bị chặn dưới bởi $u_1$.</li>
                            <li><b>B. Đúng:</b> Dãy số giảm $(v_n)$ có $v_{n+1} \le v_n$. Mọi số hạng đều $\le v_1$. Vậy dãy bị chặn trên bởi $v_1$.</li>
                            <li><b>C. Sai:</b> Một dãy số bị chặn có thể không tăng cũng không giảm. Ví dụ: dãy $u_n = (-1)^n$ (các số hạng là -1, 1, -1, 1...) bị chặn (bởi -1 và 1) nhưng không tăng cũng không giảm.</li>
                            <li><b>D. Đúng:</b> Dãy số không đổi $u_n = c$. Dãy bị chặn trên và chặn dưới bởi chính $c$.</li>
                        </ul>
                    `
                },
                {
                    id: 'p1q2',
                    question: `**Câu 2:** Cho dãy số $u_n$ (số hạng sau bằng một nửa số hạng liền trước nó). Công thức tồng quát của dãy số đã cho là:`,
                    options: [
                        `$u_n = \\frac{1}{2^n}$`,
                        `$u_n = \\frac{1}{2^{n+1}}$`,
                        `$u_n = \\frac{1}{2^{n-2}}$`,
                        `$u_n = \\frac{1}{2^{n-1}}$`
                    ],
                    correctAnswer: 'D',
                    solution: `
                        <p class="font-semibold text-lg">Chọn D</p>
                        <p class="mt-2"><b>Giải thích:</b> "Số hạng sau bằng một nửa số hạng liền trước nó" nghĩa là $u_{n+1} = \\frac{1}{2} u_n$. Đây là một cấp số nhân với công bội $q = \\frac{1}{2}$.</p>
                        <p>Tuy nhiên, đề không cho $u_1$. Giả sử $u_1 = 1$.</p>
                        <p>Khi đó, công thức tổng quát là $u_n = u_1 \cdot q^{n-1} = 1 \cdot (\\frac{1}{2})^{n-1} = \\frac{1}{2^{n-1}}$.</p>
                    `
                },
                {
                    id: 'p1q3',
                    question: `**Câu 3:** Cho dãy số $(u_n)$ với $u_n = 3n - 1$. Khẳng định nào sau đây là đúng?`,
                    options: [
                        `Dãy số $(u_n)$ là cấp số cộng với công sai $d = 3$.`,
                        `Dãy số $(u_n)$ là cấp số cộng với công sai $d = 2$.`,
                        `Dãy số $(u_n)$ là cấp số nhân với công bội $q = 3$.`,
                        `Dãy số $(u_n)$ là cấp số nhân với cộng bội $q = 2$.`
                    ],
                    correctAnswer: 'A',
                    solution: `
                        <p class="font-semibold text-lg">Chọn A</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Để kiểm tra có phải cấp số cộng không, ta xét hiệu $u_{n+1} - u_n$:</p>
                        <p>$u_{n+1} = 3(n+1) - 1 = 3n + 3 - 1 = 3n + 2$</p>
                        <p>$u_{n+1} - u_n = (3n + 2) - (3n - 1) = 3n + 2 - 3n + 1 = 3$</p>
                        <p>Vì $u_{n+1} - u_n = 3$ (là một hằng số) với mọi $n$, nên đây là cấp số cộng với công sai $d = 3$.</p>
                    `
                },
                {
                    id: 'p1q4',
                    question: `**Câu 4:** Trong các dãy số cho bởi công thức truy hồi sau, dãy số nào là cấp số nhân?`,
                    options: [
                        `$u_1 = 2, u_{n+1} = u_n + 3$`,
                        `$u_1 = 2, u_{n+1} = 2u_n$`,
                        `$u_1 = 2, u_{n+1} = u_n^2$`,
                        `$u_1 = 2, u_{n+1} = u_n - 1$`
                    ],
                    correctAnswer: 'B',
                    solution: `
                        <p class="font-semibold text-lg">Chọn B</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Cấp số nhân là dãy số có $u_{n+1} = u_n \cdot q$, với $q$ là hằng số (công bội).</p>
                        <ul class="list-disc list-inside ml-2 space-y-1">
                            <li>A: $u_{n+1} = u_n + 3$. Đây là Cấp số cộng, $d=3$.</li>
                            <li>B: $u_{n+1} = 2u_n$. Đây là Cấp số nhân, $q=2$.</li>
                            <li>C: $u_{n+1} = u_n^2$. Đây không phải CSN. (2, 4, 16, ...)</li>
                            <li>D: $u_{n+1} = u_n - 1$. Đây là Cấp số cộng, $d=-1$.</li>
                        </ul>
                    `
                },
                {
                    id: 'p1q5',
                    question: `**Câu 5:** Tổng 100 số hạng đầu của dãy số $(u_n)$ với $u_n = 2n - 1$ là`,
                    options: [
                        `199.`,
                        `$\\frac{100(2 + 199)}{2}$.`,
                        `10000.`,
                        `9999.`
                    ],
                    correctAnswer: 'C',
                    solution: `
                        <p class="font-semibold text-lg">Chọn C</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Đây là cấp số cộng với $u_1 = 1$ và công sai $d = 2$.</p>
                        <p>Cách 1: $S_{100} = \\frac{100}{2} [2(1) + (100-1)2] = 50 [2 + 198] = 50 \cdot 200 = 10000$.</p>
                        <p>Cách 2: $u_{100} = 2(100) - 1 = 199$. $S_{100} = \\frac{100}{2} (u_1 + u_{100}) = 50 (1 + 199) = 10000$.</p>
                    `
                },
                {
                    id: 'p1q6',
                    question: `**Câu 6:** Khẳng định nào sau đây là **sai**?`,
                    options: [
                        `Dãy số có $u_n = \\frac{1}{n}$.`,
                        `Hiệu số $u_{n+1} - u_n < 0, \\forall n \\in \\mathbb{N}^*$.`,
                        `Với $u_n = 2n$ thì dãy số tăng.`,
                        `Với $u_n = \\frac{1}{n}$ thì dãy số giảm.`
                    ],
                    correctAnswer: 'B',
                    solution: `
                        <p class="font-semibold text-lg">Chọn B</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Câu hỏi này có vẻ bị diễn đạt thiếu. Giả sử A, B, D đều nói về dãy $u_n = 1/n$.</p>
                        <p>Xét $u_n = 1/n$: $u_{n+1} - u_n = \\frac{-1}{n(n+1)} < 0$. Vậy dãy giảm (D đúng). Phép tính $u_{n+1} - u_n < 0$ là đúng (B đúng).</p>
                        <p>Xét $u_n = 2n$: $u_{n+1} - u_n = 2 > 0$. Dãy tăng (C đúng).</p>
                        <p><i>(Ghi chú: Lời giải gốc chọn B. Có thể B là một khẳng định chung "Mọi dãy số đều có $u_{n+1} - u_n < 0$". Hoặc có lỗi trong đề/đáp án gốc, vì B là đúng nếu xét cho dãy $u_n = 1/n$.)</i></p>
                    `
                },
                {
                    id: 'p1q7',
                    question: `**Câu 7:** Cho dãy số $(u_n)$ với $u_n = \\frac{n-1}{n+1}$. Dãy số $(u_n)$ là dãy số`,
                    options: [
                        `Bị chặn trên bởi 1.`,
                        `Giảm.`,
                        `Bị chặn dưới bởi 2.`,
                        `Tăng.`
                    ],
                    correctAnswer: 'D',
                    solution: `
                        <p class="font-semibold text-lg">Chọn D (A cũng đúng)</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>$u_{n+1} - u_n = \\frac{n}{n+2} - \\frac{n-1}{n+1} = \\frac{2}{(n+2)(n+1)} > 0$. Vậy dãy số tăng (D đúng).</p>
                        <p>Đồng thời, $u_n = 1 - \\frac{2}{n+1} < 1$. Vậy dãy bị chặn trên bởi 1 (A cũng đúng).</p>
                        <p><i>(Ghi chú: Cả A và D đều đúng. Lời giải gốc chọn D.)</i></p>
                    `
                },
                {
                    id: 'p1q8',
                    question: `**Câu 8:** Cho cấp số cộng $(u_n)$ có $u_1 = -5$ và công sai $d = 3$. Hỏi kể từ số hạng thứ mấy trở đi thì các số hạng của $(u_n)$ đều lớn hơn $100$?`,
                    options: [
                        `$n \\ge 35$.`,
                        `$n \\ge 36$.`,
                        `$n \\ge 37$.`,
                        `$n \\ge 34$.`
                    ],
                    correctAnswer: 'C',
                    solution: `
                        <p class="font-semibold text-lg">Chọn C (Lời giải gốc chọn B sai)</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>$u_n = u_1 + (n-1)d = -5 + (n-1)3 = 3n - 8$.</p>
                        <p>$u_n > 100 \Rightarrow 3n - 8 > 100 \Rightarrow 3n > 108 \Rightarrow n > 36$.</p>
                        <p>Vì $n$ là số nguyên và $n > 36$, nên $n$ phải $\ge 37$.</p>
                        <p>$u_{36} = 3(36) - 8 = 100$. $u_{37} = 3(37) - 8 = 103$.</p>
                        <p>Vậy kể từ số hạng thứ 37. <b>Đáp án đúng là C.</b></p>
                    `
                },
                {
                    id: 'p1q9',
                    question: `**Câu 9:** Xác định số hàng đầu $u_1$ và công sai $d$ của cấp số cộng $(u_n)$ có $u_9 = 5u_2$ và $u_{13} = 2u_6 + 5$.`,
                    options: [
                        `$u_1 = 3$ và $d = 4$.`,
                        `$u_1 = 3$ và $d = 5$.`,
                        `$u_1 = 4$ và $d = 3$.`,
                        `$u_1 = 5$ và $d = 3$.`
                    ],
                    correctAnswer: 'A',
                    solution: `
                        <p class="font-semibold text-lg">Chọn A</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Ta có hệ:</p>
                        <p>$\\begin{cases} u_1 + 8d = 5(u_1 + d) \\\\ u_1 + 12d = 2(u_1 + 5d) + 5 \\end{cases} \Rightarrow \\begin{cases} 4u_1 - 3d = 0 \\\\ -u_1 + 2d = 5 \\end{cases}$</p>
                        <p>Giải hệ ta được $d = 4$ và $u_1 = 3$.</p>
                    `
                },
                {
                    id: 'p1q10',
                    question: `**Câu 10:** Cho cấp số cộng $(u_n)$ có $u_1 = 1$, $u_3 = 5$. Tính tổng $S_{10}$ số hạng đầu tiên của cấp số cộng này.`,
                    options: [
                        `$S_{10} = 100$.`,
                        `$S_{10} = 110$.`,
                        `$S_{10} = 120$.`,
                        `$S_{10} = 190$.`
                    ],
                    correctAnswer: 'A',
                    solution: `
                        <p class="font-semibold text-lg">Chọn A (Lời giải gốc chọn D sai)</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>$u_3 = u_1 + 2d \Rightarrow 5 = 1 + 2d \Rightarrow d = 2$.</p>
                        <p>$S_{10} = \\frac{10}{2} [2u_1 + (10-1)d] = 5 [2(1) + 9(2)] = 5 [2 + 18] = 5 \cdot 20 = 100$.</p>
                        <p><b>Kết quả là 100. Đáp án đúng là A.</b></p>
                    `
                },
                {
                    id: 'p1q11',
                    question: `**Câu 11:** Cho cấp số cộng biết $u_5 + u_{11} = 20$ và $u_8 = 13$. Tìm số hạng đầu tiên và công sai của cấp số cộng.`,
                    options: [
                        `$u_1 = -1 ; d = 2$.`,
                        `$u_1 = 1 ; d = 2$.`,
                        `$u_1 = -1 ; d = -2$.`,
                        `$u_1 = 1 ; d = -2$.`
                    ],
                    correctAnswer: 'A',
                    solution: `
                        <p class="font-semibold text-lg">Chọn A (Dựa trên lời giải gốc, dù đề bài mâu thuẫn)</p>
                        <p class="mt-2"><b>Phân tích mâu thuẫn:</b></p>
                        <p>$u_5 + u_{11} = 20 \Rightarrow (u_1 + 4d) + (u_1 + 10d) = 20 \Rightarrow 2u_1 + 14d = 20 \Rightarrow u_1 + 7d = 10$. (1)</p>
                        <p>$u_8 = 13 \Rightarrow u_1 + 7d = 13$. (2)</p>
                        <p>Hai phương trình (1) và (2) mâu thuẫn ($10 \ne 13$). Đề bài gốc bị sai.</p>
                        <p><b>Kiểm tra đáp án A:</b> $u_1 = -1, d = 2$.</p>
                        <p>$u_1 + 7d = -1 + 7(2) = 13$. (Thỏa mãn $u_8 = 13$).</p>
                        <p>$u_5 + u_{11} = (-1 + 4(2)) + (-1 + 10(2)) = 7 + 19 = 26$. (Không thỏa mãn $u_5 + u_{11} = 20$).</p>
                        <p><i>(Ghi chú: Lời giải gốc chọn A, có lẽ đề muốn $u_8 = 13$ và $u_5 + u_{11} = 26$.)</i></p>
                    `
                },
                {
                    id: 'p1q12',
                    question: `**Câu 12:** Bốn số tạo thành một cấp số cộng có tổng bằng $20$ và tổng các bình phương của chúng bằng $120$. Tích của bốn số đó là:`,
                    options: [
                        `$384$.`,
                        `$120$.`,
                        `$400$.`,
                        `$100$.`
                    ],
                    correctAnswer: 'A',
                    solution: `
                        <p class="font-semibold text-lg">Chọn A</p>
                        <p class="mt-2"><b>Giải thích:</b></p>
                        <p>Gọi 4 số là $a-3d, a-d, a+d, a+3d$.</p>
                        <p>Tổng: $4a = 20 \Rightarrow a = 5$.</p>
                        <p>Tổng bình phương: $(5-3d)^2 + (5-d)^2 + (5+d)^2 + (5+3d)^2 = 120$.</p>
                        <p>$100 + 20d^2 = 120 \Rightarrow 20d^2 = 20 \Rightarrow d = \pm 1$.</p>
                        <p>Bốn số là 2, 4, 6, 8. Tích $2 \cdot 4 \cdot 6 \cdot 8 = 384$.</p>
                    `
                }
            ],
            part2: [
                {
                    id: 'p2q1',
                    question: `**Câu 1:** Cho cấp số cộng $u_n$ thỏa : $u_2 + u_4 + ... + u_{2n} = 126$ và $u_3 + u_5 + ... + u_{2n-1} = 117$.`,
                    items: [
                        { id: 'a', text: `$d = 2$ là công sai của cấp số`, correct: true },
                        { id: 'b', text: `$u_1 = 3$ là số hạng đầu của dãy số`, correct: true },
                        { id: 'c', text: `Công thức tổng quát của cấp số cộng là $u_n = 2n + 1$`, correct: false },
                        { id: 'd', text: `Tổng $S_n = u_1 + u_2 + ... + u_n = n^2 + 2n$.`, correct: false }
                    ],
                    solution: `
                        <p class="font-semibold text-lg">Đáp án gốc: a) Đúng, b) Đúng, c) Sai, d) Sai</p>
                        <p class="mt-2"><b>Phân tích:</b></p>
                        <p>$S_{chẵn} = n(u_1 + nd) = 126$. (1)</p>
                        <p>$S_{lẻ} = (n-1)(u_1 + nd) = 117$. (2)</p>
                        <p>Giải hệ $\Rightarrow n=14$ và $u_1 + 14d = 9$.</p>
                        <p><b>Phân tích Lời giải gốc:</b></p>
                        <p>Lời giải gốc chọn a) $d=2$ và b) $u_1=3$ là Đúng. Nhưng $u_1 + 14d = 3 + 14(2) = 31 \ne 9$. <b>Đề bài hoặc đáp án gốc có mâu thuẫn.</b></p>
                        <p><b>Giả sử a) và b) là đúng:</b></p>
                        <p>c) $u_n = 3 + (n-1)2 = 2n + 1$. Mệnh đề (c) là $u_n = 2n + 1$. Phép tính này Đúng. (Lời giải gốc chọn Sai).</p>
                        <p>d) $S_n = \\frac{n}{2} [2(3) + (n-1)2] = n(n+2) = n^2 + 2n$. Mệnh đề (d) là $S_n = n^2 + 2n$. Phép tính này Đúng. (Lời giải gốc chọn Sai).</p>
                        <p><i>(Ghi chú: Toàn bộ câu này trong tài liệu gốc có vấn đề. Chúng tôi giữ nguyên đáp án gốc.)</i></p>
                    `
                },
                {
                    id: 'p2q2',
                    question: `**Câu 2:** Cho dãy số $(v_n)$ xác định bởi $v_1 = 1$ và $v_{n+1} = \\frac{v_n}{1 + v_n}$. Đặt $u_n = \\frac{1}{v_n}$.`,
                    items: [
                        { id: 'a', text: `Dãy số $(u_n)$ là một cấp số nhân có số hạng đầu bằng 1.`, correct: false },
                        { id: 'b', text: `Dãy số $(u_n)$ là một cấp số nhân có công bội $q = 1$.`, correct: false },
                        { id: 'c', text: `Dãy số $(u_n)$ là một cấp số nhân có công bội $q = 2$.`, correct: false },
                        { id: 'd', text: `T ổng $S = v_1 + v_2 + ... + v_n = \\frac{n(n+1)}{2}$.`, correct: false }
                    ],
                    solution: `
                        <p class="font-semibold text-lg">Đáp án: a) Sai, b) Sai, c) Sai, d) Sai</p>
                        <p class="mt-2"><b>Phân tích:</b></p>
                        <p>$u_{n+1} = \\frac{1}{v_{n+1}} = \\frac{1 + v_n}{v_n} = \\frac{1}{v_n} + 1 = u_n + 1$.</p>
                        <p>Đây là <b>Cấp số cộng</b> có $d = 1$ và $u_1 = 1/v_1 = 1$.</p>
                        <p>a, b, c đều Sai vì $(u_n)$ là CSC, không phải CSN.</p>
                        <p><i>(Ghi chú: Lời giải gốc chọn a) Đúng, b) Đúng là sai kiến thức cơ bản.)</i></p>
                        <p>d) $u_n = u_1 + (n-1)d = 1 + (n-1)1 = n$.</p>
                        <p>$v_n = 1/u_n = 1/n$.</p>
                        <p>$S = 1 + \\frac{1}{2} + ... + \\frac{1}{n}$. Tổng này KHÔNG bằng $\\frac{n(n+1)}{2}$. Vậy d) Sai.</p>
                    `
                },
                {
                    id: 'p2q3',
                    question: `**Câu 3:** Cho cấp số cộng (un) thỏa mãn $u_2 + u_{2018} = 100$.`,
                    items: [
                        { id: 'a', text: `Số hạng đầu của dãy số là $u_1 = 50$.`, correct: false },
                        { id: 'b', text: `Công sai của cấp số cộng là $d = 0$.`, correct: false },
                        { id: 'c', text: `Số hạng thứ 5 của dãy số là $u_5 = 50$.`, correct: false },
                        { id: 'd', text: `Tổng $S = u_1 + u_2 + ... + u_{2019} = 100950$.`, correct: true }
                    ],
                    solution: `
                        <p class="font-semibold text-lg">Đáp án: a) Sai, b) Sai, c) Sai, d) Đúng</p>
                        <p class="mt-2"><b>Phân tích:</b></p>
                        <p>$u_2 + u_{2018} = (u_1 + d) + (u_1 + 2017d) = 2u_1 + 2018d = 100$.</p>
                        <p>a, b, c: Không thể kết luận $u_1=50$ hay $d=0$ hay $u_5=50$ chỉ từ thông tin trên.</p>
                        <p>d) $S_{2019} = \\frac{2019}{2} (u_1 + u_{2019}) = \\frac{2019}{2} (u_1 + u_1 + 2018d) = \\frac{2019}{2} (2u_1 + 2018d)$</p>
                        <p>Vì $2u_1 + 2018d = 100$, nên $S_{2019} = \\frac{2019}{2} (100) = 2019 \cdot 50 = 100950$.</p>
                        <p>Mệnh đề d) là Đúng.</p>
                        <p><i>(Ghi chú: Lời giải gốc chọn a, c Đúng và d Sai, hoàn toàn ngược lại với phép tính.)</i></p>
                    `

                        <p>c) $u_n = 3^n - n - 1$. Thử $n=1$: $u_1 = 3^1 - 1 - 1 = 1$. Không khớp $u_1 = 2$. Mệnh đề c) Sai.</p>
                        <p>b) $u_1=2, u_2=9, u_3=32, u_4=103, u_5=318, u_6=965$. $S_6 = 1429$. Mệnh đề b) Sai.</p>
                        <p>d) $u_6 = 965$. $u_7 = 2908$. Số hạng 3 chữ số lớn nhất là $u_6 = 965$. Mệnh đề d) Sai.</p>
                        <p><i>(Ghi chú: Lời giải gốc chọn a, b, c là Đúng, d là Sai. Toàn bộ câu này trong tệp gốc đều sai.)</i></p>
                    `

            ],

                    question: `**Câu 1:** Cho dãy số $(u_n)$ biết $u_n = \\frac{n^2 - 1}{n^2 + 1}$. Tìm số hạng $u_3$.`,

        function renderFormulasCard() {
            return `
                <div class="formula-card">
                    <h3 class="text-2xl font-semibold text-blue-800 mb-4">Các công thức chính</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h4 class="text-xl font-semibold text-gray-700 mb-2">Cấp số cộng (CSC)</h4>
                            <ul class="list-none space-y-2 text-gray-800">
                                <li><b>Định nghĩa:</b> $u_{n+1} = u_n + d$</li>
                                <li><b>Số hạng TQ:</b> $u_n = u_1 + (n-1)d$</li>
                                <li><b>Tính chất:</b> $u_k = \\frac{u_{k-1} + u_{k+1}}{2}$</li>
                                <li><b>Tổng $n$ số hạng:</b> $S_n = \\frac{n}{2} (u_1 + u_n)$</li>
                                <li><b>Tổng (dạng 2):</b> $S_n = \\frac{n}{2} [2u_1 + (n-1)d]$</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="text-xl font-semibold text-gray-700 mb-2">Cấp số nhân (CSN)</h4>
                            <ul class="list-none space-y-2 text-gray-800">
                                <li><b>Định nghĩa:</b> $u_{n+1} = u_n \cdot q$</li>
                                <li><b>Số hạng TQ:</b> $u_n = u_1 \cdot q^{n-1}$</li>
                                <li><b>Tính chất:</b> $u_k^2 = u_{k-1} \cdot u_{k+1}$</li>
                                <li><b>Tổng $n$ số hạng:</b> $S_n = \\frac{u_1(1 - q^n)}{1 - q}$ (với $q \ne 1$)</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function createQuestionCard(item, part) {
            let optionsHtml = '';
            
            if (part === 'part1') {
                optionsHtml = `<div class="list-none space-y-2 mt-4" id="options-${item.id}">` + 
                    item.options.map((opt, index) => {
                        const value = String.fromCharCode(65 + index); // A, B, C, D
                        return `
                        <label class="flex items-center p-3 rounded-lg border border-gray-200 hover:bg-gray-50 transition-all cursor-pointer">
                            <input type="radio" name="${item.id}" value="${value}" class="mr-3 text-blue-600 focus:ring-blue-500" data-label-id="label-${item.id}-${value}">
                            <span class="text-gray-700" id="label-${item.id}-${value}">${value}. ${opt}</span>
                        </label>
                        `;
                    }).join('') + `</div>`;
            } 
            else if (part === 'part2') {
                 optionsHtml = `<div class="list-none space-y-4 mt-4" id="options-${item.id}">` + 
                    item.items.map(subItem => `
                        <div class="p-3 rounded-lg border border-gray-200" id="sub-item-${item.id}-${subItem.id}">
                            <p class="text-gray-700 mb-2">${subItem.id}) ${subItem.text}</p>
                            <div class="flex space-x-4">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="${item.id}-${subItem.id}" value="true" class="mr-2 text-green-600 focus:ring-green-500">
                                    <span>Đúng</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="${item.id}-${subItem.id}" value="false" class="mr-2 text-red-600 focus:ring-red-500">
                                    <span>Sai</span>
                                </label>
                            </div>
                        </div>
                    `).join('') + `</div>`;
            }
            else if (part === 'part3') {
                optionsHtml = `
                <div class="mt-4">
                    <input type="text" id="${item.id}-input" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Nhập câu trả lời của bạn...">
                </div>`;
            }

            return `
                <div class="question-card">
                    <div class="font-medium text-lg text-gray-900">${item.question}</div>
                    ${optionsHtml}
                    <div class="mt-6">
                        <button class="check-button" data-check-id="${item.id}" data-part="${part}">Kiểm tra</button>
                        <div id="${item.id}" class="solution-content hidden">
                            ${item.solution}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPart(partData, partName) {
            const html = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${partData.map(item => createQuestionCard(item, partName)).join('')}
                </div>
            `;
            contentArea.innerHTML = html;
        }

        function renderContent() {
            switch (state.activeTab) {
                case 'overview':
                    renderOverview();
                    break;
                case 'part1':
                    renderPart(appData.part1, 'part1');
                    break;
                case 'part2':
                    renderPart(appData.part2, 'part2');
                    break;
                case 'part3':
                    renderPart(appData.part3, 'part3');
                    break;
            }
            
            renderMathInElement(contentArea, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ]
            });
        }

        function setupNav() {
            navTabs.addEventListener('click', (e) => {
                if (e.target.matches('.tab-button')) {
                    const tab = e.target.dataset.tab;
                    if (tab !== state.activeTab) {
                        navTabs.querySelector('.active').classList.remove('active');
                        e.target.classList.add('active');
                        state.activeTab = tab;
                        renderContent();
                    }
                }
            });
        }

        function updateScoreDisplay() {
            let totalCorrect = 0;
            
            Object.values(userScore.part1).forEach(answer => {
                if (answer.isCorrect) totalCorrect++;
            });

            Object.values(userScore.part2).forEach(question => {
                Object.values(question).forEach(subAnswer => {
                    if (subAnswer.isCorrect) totalCorrect++;
                });
            });

            Object.values(userScore.part3).forEach(answer => {
                if (answer.isCorrect) totalCorrect++;
            });

            scoreDisplay.textContent = `Điểm số: ${totalCorrect} / ${TOTAL_POINTS}`;
        }

        function handlePart1Check(itemId, itemData, button) {
            const selectedRadio = contentArea.querySelector(`input[name="${itemId}"]:checked`);
            const selectedValue = selectedRadio ? selectedRadio.value : null;
            const isCorrect = selectedValue === itemData.correctAnswer;
            
            userScore.part1[itemId] = { selected: selectedValue, correct: itemData.correctAnswer, isCorrect: isCorrect };

            const optionsLabels = contentArea.querySelectorAll(`#options-${itemId} label`);
            optionsLabels.forEach(label => {
                const radio = label.querySelector('input');
                label.classList.remove('correct-answer', 'incorrect-answer');
                if (radio.value === itemData.correctAnswer) {
                    label.classList.add('correct-answer');
                } else if (radio.value === selectedValue) {
                    label.classList.add('incorrect-answer');
                }
                radio.disabled = true;
            });
        }

        function handlePart2Check(itemId, itemData, button) {
            userScore.part2[itemId] = {};
            itemData.items.forEach(subItem => {
                const selectedRadio = contentArea.querySelector(`input[name="${itemId}-${subItem.id}"]:checked`);
                const selectedValue = selectedRadio ? selectedRadio.value : null;
                const isCorrect = String(selectedValue) === String(subItem.correct);

                userScore.part2[itemId][subItem.id] = { selected: selectedValue, correct: subItem.correct, isCorrect: isCorrect };
                
                const subItemDiv = contentArea.querySelector(`#sub-item-${itemId}-${subItem.id}`);
                subItemDiv.classList.remove('correct-answer', 'incorrect-answer');
                if (isCorrect) {
                    subItemDiv.classList.add('correct-answer');
                } else {
                    subItemDiv.classList.add('incorrect-answer');
                }
                
                const radios = subItemDiv.querySelectorAll('input[type="radio"]');
                radios.forEach(radio => radio.disabled = true);
            });
        }

        function handlePart3Check(itemId, itemData, button) {
            const inputField = contentArea.querySelector(`#${itemId}-input`);
            const inputValue = inputField.value.trim();
            const isCorrect = itemData.correctAnswer.includes(inputValue);
            
            userScore.part3[itemId] = { input: inputValue, correct: itemData.correctAnswer, isCorrect: isCorrect };

            inputField.classList.remove('correct-answer', 'incorrect-answer');
            if (isCorrect) {
                inputField.classList.add('correct-answer');
            } else {
                inputField.classList.add('incorrect-answer');
            }
            inputField.disabled = true;
        }

        function setupCheckButtons() {
            contentArea.addEventListener('click', (e) => {
                if (e.target.matches('.check-button:not(:disabled)')) {
                    const button = e.target;
                    const itemId = button.dataset.checkId;
                    const part = button.dataset.part;
                    
                    const itemData = appData[part].find(item => item.id === itemId);
                    
                    if (!itemData) return;

                    if (part === 'part1') {
                        handlePart1Check(itemId, itemData, button);
                    } else if (part === 'part2') {
                        handlePart2Check(itemId, itemData, button);
                    } else if (part === 'part3') {
                        handlePart3Check(itemId, itemData, button);
                    }
                    
                    const solutionContent = document.getElementById(itemId);
                    if (solutionContent) {
                        solutionContent.classList.remove('hidden');
                    }
                    
                    button.disabled = true;
                    button.textContent = 'Đã kiểm tra';
                    
                    updateScoreDisplay();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupNav();
            setupCheckButtons();
            renderContent(); 
        });
    </script>

</body>
</html>
