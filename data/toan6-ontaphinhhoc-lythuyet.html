<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Khai báo bảng mã ký tự tiếng Việt -->
    <meta charset="UTF-8">
    <!-- Tương thích hiển thị trên thiết bị di động -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tiêu đề trang web hiển thị trên tab trình duyệt -->
    <title>Trang Web Hoàn Chỉnh</title>
    
    <!-- Liên kết đến thư viện CSS (ví dụ: Tailwind CSS hoặc file CSS tùy chỉnh) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS tùy chỉnh bổ sung nếu cần */
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Phần Đầu trang (Header) -->
    <header class="bg-white border-b border-slate-200 shadow-xs sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-xl font-black text-indigo-600">Logo Website</h1>
            <nav class="space-x-4 text-sm font-semibold">
                <a href="#" class="hover:text-indigo-600">Trang chủ</a>
                <a href="#" class="hover:text-indigo-600">Giới thiệu</a>
                <a href="#" class="hover:text-indigo-600">Liên hệ</a>
            </nav>
        </div>
    </header>

    <!-- Phần Nội dung chính (Main Content) -->
    <main class="max-w-4xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
        <section class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-2xl font-extrabold text-slate-900">Chào mừng bạn đến với trang web!</h2>
            <p class="text-slate-600 leading-relaxed text-justify">
                Đây là khung nội dung mẫu được thiết kế gọn gàng, hiện đại. Bạn có thể dễ dàng thay đổi văn bản, hình ảnh hoặc bổ sung các thành phần tương tác theo nhu cầu sử dụng.
            </p>
            <button class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-indigo-700 transition-all cursor-pointer">
                <i class="fa-solid fa-arrow-right mr-2"></i> Khám phá ngay
            </button>
        </section>
    </main>

    <!-- Phần Chân trang (Footer) -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs mt-auto">
        <p class="font-bold text-slate-300">@ Bản quyền thuộc về tác giả - Mọi quyền được bảo lưu.</p>
    </footer>

    <!-- Các tập lệnh JavaScript (nếu có) -->
    <script>
        console.log("Trang web đã tải thành công!");
    </script>
</body>
</html>
